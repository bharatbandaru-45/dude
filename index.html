
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT DUDE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
  padding: 30px;
}

h1 {
  font-size: 38px;
  letter-spacing: 5px;
  color: #00d9ff;
}

.subtitle {
  color: #8295ad;
  margin-top: 12px;
}

.mic {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  margin: 50px auto 25px;
  border: 2px solid #00d9ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 65px;
  box-shadow: 0 0 35px #007bff55;
}

.status {
  color: #00d9ff;
  font-size: 17px;
  margin: 20px;
}

button {
  background: #00bde8;
  color: #06101c;
  border: none;
  padding: 14px 35px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  margin-top: 55px;
  color: #52647c;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

  <h1>PROJECT DUDE</h1>
  <p class="subtitle">Your Personal Voice Assistant</p>

  <div class="mic">🎙️</div>

  <p class="status" id="status">SYSTEM STANDBY</p>

  <button onclick="startDude()">ACTIVATE DUDE</button>
  <br><br>
<button onclick="stopDude()" style="background:#ff4757;">
  STOP DUDE
</button>

  <p id="heard" style="margin-top:25px;color:#8295ad;"></p>

  <footer>POWERED BY PROJECT DUDE</footer>

</div>



<script>
let recognition;
let waitingForCommand = false;
let isRunning = false;
function stopDude() {
  isRunning = false;
  waitingForCommand = false;

  if (recognition) {
    recognition.stop();
  }

  window.speechSynthesis.cancel();

  document.getElementById("status").innerText =
    "DUDE STOPPED";

  document.getElementById("heard").innerText = "";
}
function startDude() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("status").innerText =
      "Browser not supported";
    return;
  }

  if (isRunning) return;

  isRunning = true;
  waitingForCommand = false;

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = true;
  recognition.interimResults = false;

  document.getElementById("status").innerText =
    "LISTENING FOR HEY DUDE...";

  recognition.onresult = function(event) {

    for (let i = event.resultIndex;
         i < event.results.length; i++) {

      if (!event.results[i].isFinal) continue;

      const text =
        event.results[i][0].transcript.toLowerCase().trim();

      document.getElementById("heard").innerText =
        "Heard: " + text;

      if (text.includes("hey dude") && !waitingForCommand) {

        waitingForCommand = true;

        document.getElementById("status").innerText =
          "DUDE ACTIVATED - SPEAK NOW";

        recognition.stop();

        const speech = new SpeechSynthesisUtterance(
          "Yes, I'm listening!"
        );

        speech.onend = function() {
          recognition.start();
        };

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(speech);

      } else if (waitingForCommand) {

        waitingForCommand = false;

        document.getElementById("status").innerText =
          "COMMAND RECEIVED";

        window.postMessage({
  type: "DUDE_SEND_COMMAND",
  text: text
}, "*");

        const reply = new SpeechSynthesisUtterance(
          "Command received: " + text
        );

        window.speechSynthesis.speak(reply);
      }
    }
  };

  recognition.onend = function() {
    if (isRunning && !window.speechSynthesis.speaking) {
      recognition.start();
    }
  };

  recognition.onerror = function(event) {
    document.getElementById("status").innerText =
      "MIC ERROR: " + event.error;
  };

  recognition.start();
}
</script>


</body>
</html>
