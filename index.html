
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT DUDE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
  padding: 30px;
}

h1 {
  font-size: 38px;
  letter-spacing: 5px;
  color: #00d9ff;
}

.subtitle {
  color: #8295ad;
  margin-top: 12px;
}

.mic {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  margin: 50px auto 25px;
  border: 2px solid #00d9ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 65px;
  box-shadow: 0 0 35px #007bff55;
}

.status {
  color: #00d9ff;
  font-size: 17px;
  margin: 20px;
}

button {
  background: #00bde8;
  color: #06101c;
  border: none;
  padding: 14px 35px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  margin-top: 55px;
  color: #52647c;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

  <h1>PROJECT DUDE</h1>
  <p class="subtitle">Your Personal Voice Assistant</p>

  <div class="mic">🎙️</div>
